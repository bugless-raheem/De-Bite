openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: De•Bite restaurant ordering API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: menu
    description: Menu and availability
  - name: orders
    description: Customer orders and tracking
  - name: admin
    description: Protected restaurant operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /menu:
    get:
      operationId: listMenu
      tags: [menu]
      summary: List all menu items
      responses:
        "200":
          description: Menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
  /menu/{id}/availability:
    patch:
      operationId: updateMenuAvailability
      tags: [menu]
      summary: Toggle a menu item availability
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuAvailabilityInput"
      responses:
        "200":
          description: Updated menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "404":
          $ref: "#/components/responses/NotFound"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List recent orders for the restaurant
      responses:
        "200":
          description: Recent orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order before sending it to WhatsApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/track:
    post:
      operationId: trackOrder
      tags: [orders]
      summary: Find an order by ID and phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackOrderInput"
      responses:
        "200":
          description: Matching order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"
  /orders/{id}/payment:
    patch:
      operationId: updateOrderPayment
      tags: [orders]
      summary: Mark an order payment as confirmed
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"
  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update the current order status
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Authenticate the restaurant admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Admin session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Check the current admin session
      responses:
        "200":
          description: Active admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: List Supabase orders for the restaurant
      responses:
        "200":
          description: Supabase orders with their items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/orders/{orderId}/status:
    patch:
      operationId: updateAdminOrderStatus
      tags: [admin]
      summary: Update a Supabase order status
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOrderStatusInput"
      responses:
        "200":
          description: Updated Supabase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
        "400":
          description: Invalid status request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Admin authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    MenuItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        price: { type: number }
        image: { type: string }
        options:
          type: array
          items:
            $ref: "#/components/schemas/MenuOption"
        available: { type: boolean }
        featured: { type: boolean }
      required: [id, name, category, description, price, image, options, available, featured]
    MenuOption:
      type: object
      properties:
        label: { type: string }
        values:
          type: array
          items: { type: string }
        prices:
          type: object
          additionalProperties: { type: number }
      required: [label, values, prices]
    MenuAvailabilityInput:
      type: object
      properties:
        available: { type: boolean }
      required: [available]
    OrderLineInput:
      type: object
      properties:
        itemId: { type: string }
        name: { type: string }
        quantity: { type: number, minimum: 1 }
        unitPrice: { type: number, minimum: 0 }
        customizations:
          type: object
          additionalProperties: { type: string }
      required: [itemId, name, quantity, unitPrice, customizations]
    OrderInput:
      type: object
      properties:
        customerName: { type: string, minLength: 2 }
        phone: { type: string, minLength: 7 }
        orderType:
          type: string
          enum: [delivery, pickup]
        address: { type: ["string", "null"] }
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderLineInput"
        subtotal: { type: number, minimum: 0 }
        deliveryFee: { type: number, minimum: 0 }
        total: { type: number, minimum: 0 }
      required: [customerName, phone, orderType, lines, subtotal, deliveryFee, total]
    TrackOrderInput:
      type: object
      properties:
        orderId: { type: string, minLength: 4 }
        phone: { type: string, minLength: 7 }
      required: [orderId, phone]
    PaymentInput:
      type: object
      properties:
        paymentConfirmed: { type: boolean }
      required: [paymentConfirmed]
    OrderStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [received, confirmed, preparing, ready, out_for_delivery, completed]
      required: [status]
    Order:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string }
        customerName: { type: string }
        phone: { type: string }
        orderType:
          type: string
          enum: [delivery, pickup]
        address: { type: ["string", "null"] }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
        subtotal: { type: number }
        deliveryFee: { type: number }
        total: { type: number }
        paymentConfirmed: { type: boolean }
        status:
          type: string
          enum: [received, confirmed, preparing, ready, out_for_delivery, completed]
      required: [id, createdAt, customerName, phone, orderType, address, lines, subtotal, deliveryFee, total, paymentConfirmed, status]
    OrderLine:
      type: object
      properties:
        itemId: { type: string }
        name: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        customizations:
          type: object
          additionalProperties: { type: string }
      required: [itemId, name, quantity, unitPrice, customizations]
    AdminLoginInput:
      type: object
      properties:
        password: { type: string, minLength: 1 }
      required: [password]
    AdminLoginResult:
      type: object
      properties:
        authenticated: { type: boolean }
      required: [authenticated]
    AdminSession:
      type: object
      properties:
        authenticated: { type: boolean }
      required: [authenticated]
    AdminOrderStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [received, preparing, out_for_delivery, delivered]
      required: [status]
    AdminOrderItem:
      type: object
      properties:
        itemName: { type: string }
        quantity: { type: number }
        customizations:
          type: object
          additionalProperties: {}
      required: [itemName, quantity, customizations]
    AdminOrder:
      type: object
      properties:
        orderId: { type: string }
        customerName: { type: string }
        phone: { type: string }
        orderType: { type: string }
        total: { type: number }
        status:
          type: string
          enum: [received, preparing, out_for_delivery, delivered]
        createdAt: { type: ["string", "null"] }
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrderItem"
      required: [orderId, customerName, phone, orderType, total, status, createdAt, items]